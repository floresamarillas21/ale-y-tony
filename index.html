<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Ale 🌻</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            /* Fondo de atardecer mágico */
            background-image: url('https://images.unsplash.com/photo-1501426026826-31c667bdf23d?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Playfair Display', serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }

        /* Capa oscura para que resalte el contenido */
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 245, 230, 0.4);
            backdrop-filter: blur(4px);
            z-index: 1;
        }

        /* Partículas de luz de fondo */
        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 215, 0, 0.6);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
            animation: floatup linear infinite;
            z-index: 2;
        }
        @keyframes floatup {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        #start-btn {
            text-align: center;
            cursor: pointer;
            z-index: 10;
            background: rgba(255, 255, 255, 0.85);
            padding: 30px 50px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            border: 2px solid #e8b923;
            transition: all 0.3s;
        }
        #start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 20px 40px rgba(232, 185, 35, 0.4);
        }
        .big-flower {
            font-size: 80px;
            animation: pulse 2s infinite;
            display: inline-block;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.8));
        }
        #start-btn p {
            font-size: 24px;
            font-family: 'Dancing Script', cursive;
            margin: 0;
            color: #8b6508;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        #scene {
            display: none;
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 5;
        }
        
        .stem {
            position: absolute;
            bottom: 40%; 
            left: 50%;
            width: 8px;
            height: 0;
            background: linear-gradient(to top, #1a4a31, #2d6a4f, #40916c);
            transform: translateX(-50%);
            transition: height 2s ease-in-out;
            border-radius: 10px 10px 0 0;
            box-shadow: 0 0 10px rgba(45, 106, 79, 0.5);
        }
        
        #flowers-container {
            position: absolute;
            left: 50%;
            width: 0;
            height: 0;
        }
        
        .flower {
            position: absolute;
            font-size: 24px;
            transform: scale(0);
            animation: popIn 0.6s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }
        
        @keyframes popIn {
            to { transform: scale(1) translate(-50%, -50%); }
        }
        
        /* La nueva tarjeta elegante para el texto */
        #text-container {
            position: absolute;
            bottom: 3%;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 500px;
            text-align: center;
            background: rgba(255, 253, 248, 0.9);
            padding: 20px 15px;
            border-radius: 15px;
            border: 1px solid #d4af37;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            opacity: 0;
            transition: opacity 2s;
        }
        
        .line {
            opacity: 0;
            transform: translateY(15px);
            transition: opacity 1s, transform 1s;
            margin-bottom: 10px;
            font-size: 16px;
            color: #4a4a4a;
        }
        
        .line.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        .title {
            font-family: 'Dancing Script', cursive;
            font-size: 28px;
            color: #b8860b;
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .author {
            font-family: 'Dancing Script', cursive;
            font-size: 24px;
            color: #b8860b;
            margin-top: 15px;
        }

        @media (min-width: 768px) {
            .stem { bottom: 35%; width: 10px; }
            #text-container { bottom: 5%; padding: 30px; }
            .line { font-size: 18px; line-height: 1.8; }
            .title { font-size: 34px; }
            .flower { font-size: 28px; }
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div id="start-btn" onclick="start()">
        <div class="big-flower">🌻</div>
        <p>Toca aquí, Ale</p>
    </div>

    <div id="scene">
        <div class="stem" id="stem"></div>
        <div id="flowers-container"></div>
        <div id="text-container"></div>
    </div>

    <script>
        // Crear partículas mágicas de fondo
        function createParticles() {
            const numParticles = 30;
            for(let i = 0; i < numParticles; i++) {
                let particle = document.createElement('div');
                particle.className = 'particle';
                let size = Math.random() * 5 + 2;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + 'vw';
                particle.style.animationDuration = (Math.random() * 5 + 5) + 's';
                particle.style.animationDelay = (Math.random() * 5) + 's';
                document.body.appendChild(particle);
            }
        }
        createParticles();

        const messages = [
            "<div class='title'>🌻 Feliz Día de las Flores Amarillas 🌻</div>",
            "Cada girasol que ves aquí es un latido de mi corazón.",
            "Así como el sol ilumina los campos, tú iluminas mi vida.",
            "Que estas flores te recuerden lo especial que eres para mí.",
            "<div class='author'>&mdash; ¡Te Amo! &mdash;</div>"
        ];

        function start() {
            document.getElementById('start-btn').style.display = 'none';
            const scene = document.getElementById('scene');
            scene.style.display = 'block';
            
            const textContainer = document.getElementById('text-container');
            textContainer.style.opacity = '1';

            const isMobile = window.innerWidth < 768;
            // Tallo un poco más corto para que deje espacio a la tarjeta
            const stemHeight = isMobile ? window.innerHeight * 0.35 : window.innerHeight * 0.45; 
            
            const stem = document.getElementById('stem');
            setTimeout(() => {
                stem.style.height = stemHeight + 'px';
            }, 100);

            setTimeout(() => {
                createHeartFlowers(stemHeight, isMobile);
            }, 2000); 

            setTimeout(() => {
                showText();
            }, 4500); 
        }

        function createHeartFlowers(stemHeight, isMobile) {
            const container = document.getElementById('flowers-container');
            const bottomPercent = isMobile ? 40 : 35;
            container.style.bottom = `calc(${bottomPercent}% + ${stemHeight}px - 15px)`; 

            const numFlowers = 150; 
            
            for (let i = 0; i < numFlowers; i++) {
                const t = Math.random() * Math.PI * 2;
                const scale = isMobile ? 11 : 16; 
                const r = Math.sqrt(Math.random()) * scale; 

                const x = r * 16 * Math.pow(Math.sin(t), 3);
                const y = -r * (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

                const flower = document.createElement('div');
                flower.className = 'flower';
                flower.innerHTML = '🌻';
                
                flower.style.left = `${x}px`;
                flower.style.top = `${y}px`;
                flower.style.animationDelay = `${Math.random() * 2.5}s`;
                
                container.appendChild(flower);
            }
        }

        function showText() {
            const container = document.getElementById('text-container');
            messages.forEach((text, index) => {
                const p = document.createElement('div');
                p.className = 'line';
                p.innerHTML = text;
                container.appendChild(p);

                setTimeout(() => {
                    p.classList.add('visible');
                }, index * 1600); 
            });
        }
    </script>
</body>
</html>
